<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0f766e"/>

  <!-- Concrete block / pillar shape -->
  <!-- Base slab -->
  <rect x="5" y="23" width="22" height="4" rx="1" fill="#ffffff" opacity="0.95"/>

  <!-- Left pillar -->
  <rect x="6" y="10" width="6" height="14" rx="1" fill="#ffffff" opacity="0.90"/>

  <!-- Right pillar -->
  <rect x="20" y="10" width="6" height="14" rx="1" fill="#ffffff" opacity="0.90"/>

  <!-- Top beam -->
  <rect x="5" y="8" width="22" height="4" rx="1" fill="#ffffff" opacity="0.95"/>

  <!-- Center formula hint: small "C" mark -->
  <text x="16" y="20" font-family="Arial, sans-serif" font-size="7" font-weight="bold"
        fill="#0f766e" text-anchor="middle" dominant-baseline="middle">w/c</text>
</svg>